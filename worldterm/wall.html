<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worldterm wall</title>
<!--
  worldterm's wall page: a read-only view for a big screen. It polls /api/state every
  five seconds and rotates the unacknowledged Critical and Major headlines itself.
  Everything from the feeds is written with textContent, never innerHTML, and the CSP
  above blocks anything that is not this file or /api/state. No external resources:
  the wall may be offline.
-->
<style>
  :root {
    --surface: #0f1115; --panel: #171a21; --line: #2a2f3a;
    --ink: #e8eaf0; --ink-2: #aab2c0; --ink-3: #808a9c;   /* ink-3 is 4.6:1 on the panel */
    --accent: #58d1eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.1vw, 48px); background: var(--surface); color: var(--ink);
         font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { height: 100vh; overflow: hidden; display: grid; gap: 1rem; padding: 1rem;
         grid-template-columns: 2fr 1fr; grid-template-rows: auto minmax(0, 1fr); }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 1.5rem; padding: 0 .25rem; }
  .wordmark { font-weight: 800; letter-spacing: .18em; font-size: 1.1rem; }
  .meta { margin-left: auto; display: flex; gap: 1.5rem; color: var(--ink-2); font-size: 1rem;
          font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 600; }
  #banner { background: #3a2a10; color: #ffd27a; border: 1px solid #7a5a1a; padding: .2rem .7rem;
            border-radius: .4rem; font-size: .95rem; }
  #banner[hidden] { display: none; }
  main { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 1rem; min-height: 0; }
  /* tiles, arrivals and sources take what they need; the weather panel gets the rest and clips */
  aside { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 1rem; min-height: 0; }
  section { background: var(--panel); border-radius: .6rem; padding: .9rem 1.1rem; min-height: 0; overflow: hidden; }
  h2 { font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
       margin-bottom: .6rem; }
  .chip { display: inline-block; padding: .08em .5em; border-radius: .3em; font-weight: 700; font-size: .85rem;
          letter-spacing: .06em; white-space: nowrap; vertical-align: middle; }

  /* headline stage */
  #stage { display: flex; flex-direction: column; justify-content: center; gap: 1rem; position: relative;
           padding: 1.5rem 2rem 2rem; }
  #stage .line { display: flex; align-items: center; gap: 1rem; color: var(--ink-2); font-size: 1.1rem; }
  #stage .line .chip { font-size: 1.05rem; }
  #stage .source { color: var(--ink); font-weight: 600; }
  #stage .title { font-size: 3.2rem; line-height: 1.15; font-weight: 650; letter-spacing: -.01em;
                  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
                  overflow: hidden; overflow-wrap: anywhere; }
  #stage .title.idle { color: var(--ink-3); font-size: 2.2rem; font-weight: 500; }
  #stage .counter { color: var(--ink-3); font-size: 1rem; font-variant-numeric: tabular-nums; }
  #progress { position: absolute; left: 0; right: 0; bottom: 0; height: .35rem; background: #22262f;
              border-radius: 0 0 .6rem .6rem; overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { #progress { display: none; } }

  /* ticker */
  /* exactly six rows: overflow clips at the padding edge, so there is no bottom padding */
  #ticker { padding: .7rem 1.1rem 0; height: calc(6 * 2.3rem + .7rem); }
  #ticker .row { display: flex; align-items: center; gap: .7rem; height: 2.3rem; font-size: 1.1rem;
                 white-space: nowrap; border-top: 1px solid var(--line); }
  #ticker .row:first-child { border-top: 0; }
  #ticker .src { color: var(--ink-2); flex: 0 0 9rem; overflow: hidden; text-overflow: ellipsis; }
  #ticker .txt { overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  #ticker .age { color: var(--ink-3); font-size: .9rem; font-variant-numeric: tabular-nums; }

  /* severity tiles */
  #tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; background: none; padding: 0; }
  .tile { border-radius: .5rem; padding: .6rem .7rem .5rem; line-height: 1.05; min-width: 0; }
  .tile .n { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .l { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: .25rem; }
  .tile .s { font-size: .75rem; opacity: .85; margin-top: .15rem; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }

  /* arrivals */
  #arrivals .bars { display: flex; align-items: flex-end; gap: 2px; height: 3.8rem; }
  #arrivals .bar { flex: 1 1 0; background: var(--accent); opacity: .55; border-radius: 3px 3px 0 0; min-height: 2px; }
  #arrivals .bar.now { opacity: 1; }
  #arrivals .bar.zero { background: var(--line); opacity: 1; }
  #arrivals .axis { display: flex; justify-content: space-between; color: var(--ink-3); font-size: .75rem; margin-top: .3rem; }
  #arrivals .caption { color: var(--ink-2); font-size: .9rem; margin-top: .4rem; }

  /* sources */
  #sources .rows { display: grid; gap: .35rem; }
  #sources .row { display: grid; grid-template-columns: 9rem 1fr 3rem; align-items: center; gap: .7rem; font-size: .95rem; }
  #sources .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sources .total { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #sources .bar { display: flex; gap: 2px; height: 1.1rem; }
  #sources .seg { border-radius: 2px; min-width: 2px; }
  #sources .legend { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }

  /* weather */
  #weather[hidden] { display: none; }
  #weather .tiles { display: flex; gap: 1.2rem; margin-bottom: .5rem; }
  #weather .tiles div { line-height: 1.1; }
  #weather .tiles b { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #weather .tiles span { display: block; color: var(--ink-3); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
  #weather .kinds { color: var(--ink-2); font-size: .9rem; margin-bottom: .4rem; }
  #weather .levels { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
  #weather .types { display: grid; gap: .25rem; font-size: .9rem; }
  #weather .type { display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: center; white-space: nowrap; }
  #weather .type .ev { overflow: hidden; text-overflow: ellipsis; }
  #weather .type .ct { color: var(--ink-2); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="wordmark">WORLDTERM</div>
  <div id="banner" hidden></div>
  <div class="meta">
    <span id="outstanding"></span>
    <span id="refresh"></span>
    <span id="clock"></span>
  </div>
</header>
<main>
  <section id="stage">
    <div class="line"><span id="st-chip" class="chip"></span><span id="st-source" class="source"></span><span id="st-when"></span></div>
    <div id="st-title" class="title idle">Waiting for worldterm</div>
    <div id="st-counter" class="counter"></div>
    <div id="progress"><div></div></div>
  </section>
  <section id="ticker"></section>
</main>
<aside>
  <section id="tiles"></section>
  <section id="arrivals"><h2>Inbound events, last 24 hours</h2><div class="bars"></div>
    <div class="axis"><span>24 h ago</span><span>12 h</span><span>now</span></div><div class="caption"></div></section>
  <section id="sources"><h2>By source</h2><div class="rows"></div><div class="legend"></div></section>
  <section id="weather" hidden><h2>Weather alerts</h2><div class="tiles"></div><div class="kinds"></div>
    <div class="levels"></div><div class="types"></div></section>
</aside>
<script>
(function () {
  "use strict";
  const POLL_MS = 5000, FETCH_TIMEOUT_MS = 4000, CYCLE_MS = 8000;
  const $ = (id) => document.getElementById(id);
  let state = null, unreachableSince = null, currentKey = null, cycleStart = 0;

  // -------------------------------------------------------------- helpers (text only)
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function hhmm(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()); }
  function fmtWhen(iso) {
    if (!iso) return "";
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? hhmm(d) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " " + hhmm(d);
  }
  function ago(iso) {
    if (!iso) return "";
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }
  function paint(node, sev) {
    const p = state && state.palette[sev];
    if (p) { node.style.background = p.bg; node.style.color = p.fg; }
    return node;
  }
  function chip(sev, text) {
    const p = state && state.palette[sev];
    return paint(el("span", "chip", text !== undefined ? text : (p ? p.label : sev)), sev);
  }

  // -------------------------------------------------------------- polling
  async function poll() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
    let fresh = null;
    try {
      const r = await fetch("/api/state", { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      fresh = await r.json();
      unreachableSince = null;
    } catch (err) {
      if (!unreachableSince) unreachableSince = new Date();
    } finally {
      clearTimeout(timer);
    }
    if (fresh) state = fresh;
    renderBanner();
    if (fresh) render();   // a rendering bug surfaces in the console, not as "unreachable"
  }

  function renderBanner() {
    const banner = $("banner");
    if (unreachableSince) {
      banner.textContent = "worldterm unreachable since " + hhmm(unreachableSince) + (state ? " · showing the last data" : "");
      banner.hidden = false;
    } else if (state && !state.ready) {
      banner.textContent = "waiting for worldterm's first fetch";
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }

  // -------------------------------------------------------------- statistics
  function render() {
    if (!state || !state.ready) return;
    renderHeader(); renderTiles(); renderArrivals(); renderSources(); renderWeather(); renderTicker();
    renderStage(true);
  }

  function renderHeader() {
    const out = $("outstanding"); clear(out);
    out.appendChild(el("b", null, String(state.totals.outstanding)));
    out.appendChild(document.createTextNode(" unacknowledged of " + state.totals.events + " events from " +
      state.totals.sources + (state.totals.sources === 1 ? " source" : " sources")));
    renderRefresh();
  }
  function renderRefresh() {
    if (!state || !state.ready) return;
    const r = state.refresh, parts = [];
    if (r.last_refresh) parts.push("refreshed " + hhmm(new Date(r.last_refresh)));
    if (r.next_refresh_at) {
      const left = Math.max(0, Math.round((new Date(r.next_refresh_at).getTime() - Date.now()) / 1000));
      parts.push("next in " + Math.floor(left / 60) + ":" + pad(left % 60));
    }
    $("refresh").textContent = parts.join(" · ");
  }

  function renderTiles() {
    const box = $("tiles"); clear(box);
    const rows = {};
    state.severity.forEach((r) => { rows[r.severity] = r; });
    const shown = state.order.filter((s) => rows[s]);
    box.style.gridTemplateColumns = "repeat(" + Math.max(1, shown.length) + ", 1fr)";
    shown.forEach((s) => {
      const r = rows[s], tile = paint(el("div", "tile"), s);
      tile.appendChild(el("div", "n", String(r.outstanding)));
      tile.appendChild(el("div", "l", r.label));
      tile.appendChild(el("div", "s", "of " + r.total + " · " + r.acknowledged + " acked"));
      tile.title = r.label + ": " + r.outstanding + " unacknowledged of " + r.total;
      box.appendChild(tile);
    });
  }

  function renderArrivals() {
    const a = state.arrivals, bars = $("arrivals").querySelector(".bars"); clear(bars);
    const peak = Math.max(1, a.peak), now = new Date();
    a.buckets.forEach((n, i) => {
      const bar = el("div", "bar" + (i === a.buckets.length - 1 ? " now" : "") + (n ? "" : " zero"));
      bar.style.height = n ? Math.max(4, Math.round(100 * n / peak)) + "%" : "2px";
      const hour = new Date(now.getTime() - (a.buckets.length - 1 - i) * 3600000).getHours();
      bar.title = pad(hour) + ":00–" + pad(hour) + ":59 · " + n + (n === 1 ? " event" : " events");
      bars.appendChild(bar);
    });
    $("arrivals").querySelector(".caption").textContent =
      "peak " + a.peak + "/h · " + a.total + " in 24 h · " + a.older + " older";
  }

  function renderSources() {
    const rows = $("sources").querySelector(".rows"), legend = $("sources").querySelector(".legend");
    clear(rows); clear(legend);
    const used = new Set();
    state.sources.forEach((s) => {
      const row = el("div", "row");
      const name = s.folded ? "Other (" + s.folded + " sources)" : s.node;
      row.appendChild(el("div", "name", name));
      const bar = el("div", "bar");
      const parts = [];
      state.order.forEach((sev) => {
        const n = s.by_severity[sev] || 0;
        if (!n) return;
        used.add(sev);
        const seg = paint(el("div", "seg"), sev);
        seg.style.flex = n + " 1 0";
        bar.appendChild(seg);
        parts.push(state.palette[sev].label + " " + n);
      });
      row.title = name + ": " + s.total + " events, " + s.outstanding + " unacknowledged (" + parts.join(", ") + ")";
      row.appendChild(bar);
      row.appendChild(el("div", "total", String(s.total)));
      rows.appendChild(row);
    });
    state.order.filter((s) => used.has(s)).forEach((s) => legend.appendChild(chip(s)));
  }

  function renderWeather() {
    const w = state.weather, box = $("weather");
    if (!w) { box.hidden = true; return; }
    box.hidden = false;
    const tiles = box.querySelector(".tiles"); clear(tiles);
    [[w.active, "active"], [w.immediate, "immediate"], [w.offices, "offices"], [w.states, "states"]].forEach(([n, label]) => {
      const t = el("div"); t.appendChild(el("b", null, String(n))); t.appendChild(el("span", null, label)); tiles.appendChild(t);
    });
    const PLURAL = { Warning: "Warnings", Watch: "Watches", Advisory: "Advisories", Statement: "Statements", Outlook: "Outlooks", Other: "Other" };
    box.querySelector(".kinds").textContent = w.kinds.map(([k, n]) => n + " " + (n === 1 ? k : (PLURAL[k] || k + "s"))).join(" \u00b7 ") || "no active alerts";
    const levels = box.querySelector(".levels"); clear(levels);
    w.severity.forEach((r) => levels.appendChild(chip(r.severity, r.nws + " " + r.total)));
    const types = box.querySelector(".types"); clear(types);
    w.types.forEach((t) => {
      const row = el("div", "type");
      row.appendChild(chip(t.level, t.level));
      row.appendChild(el("span", "ev", t.event));
      row.appendChild(el("span", "ct", t.total + " · " + t.states + (t.states === 1 ? " state" : " states")));
      types.appendChild(row);
    });
  }

  function renderTicker() {
    const box = $("ticker"); clear(box);
    state.ticker.forEach((t) => {
      const row = el("div", "row");
      row.appendChild(chip(t.severity, t.severity));
      row.appendChild(el("span", "src", t.source));
      row.appendChild(el("span", "txt", t.title));
      row.appendChild(el("span", "age", ago(t.when)));
      box.appendChild(row);
    });
  }

  // -------------------------------------------------------------- rotation
  function renderStage(fromPoll) {
    if (!state || !state.ready) return;
    const items = state.headlines.items, now = Date.now();
    if (!items.length) {
      currentKey = null;
      $("st-chip").textContent = ""; $("st-chip").removeAttribute("style");
      $("st-source").textContent = ""; $("st-when").textContent = "";
      $("st-title").textContent = "No unacknowledged Critical or Major headlines";
      $("st-title").className = "title idle";
      $("st-counter").textContent = ""; $("progress").firstElementChild.style.width = "0";
      return;
    }
    let index = items.findIndex((h) => h.key === currentKey);
    if (index < 0) { index = 0; cycleStart = now; }
    else if (!fromPoll && items.length > 1 && now - cycleStart >= CYCLE_MS) {
      index = (index + 1) % items.length; cycleStart = now;
    }
    const h = items[index];
    currentKey = h.key;
    paint($("st-chip"), h.severity).textContent = state.palette[h.severity].label;
    $("st-source").textContent = h.source;
    $("st-when").textContent = fmtWhen(h.when) + " · " + ago(h.when);
    $("st-title").textContent = h.title;
    $("st-title").className = "title";
    $("st-counter").textContent = (index + 1) + " / " + state.headlines.total + " unacknowledged";
    $("progress").firstElementChild.style.width = Math.min(100, 100 * (now - cycleStart) / CYCLE_MS) + "%";
  }

  setInterval(() => { renderStage(false); }, 250);
  setInterval(() => { $("clock").textContent = hhmm(new Date()); renderRefresh(); }, 1000);
  $("clock").textContent = hhmm(new Date());
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
